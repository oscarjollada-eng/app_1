name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: |
          set -o pipefail
          gradle --no-daemon -PversionCode=${{ github.run_number }} :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Guardar log (rama ci-log)
        if: always()
        run: |
          D="$RUNNER_TEMP/logrepo"
          rm -rf "$D" && mkdir "$D" && cd "$D"
          git init -q && git checkout -q -b ci-log
          cp "$RUNNER_TEMP/build.log" build.log 2>/dev/null || echo "sin log" > build.log
          echo "run ${{ github.run_number }} · ${{ job.status }} · ${{ github.sha }}" > STATUS.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "log run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-log

      - name: Publicar versión
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" chanchi.apk
          gh release create "v${{ github.run_number }}" chanchi.apk \
            --title "Chanchi 1.${{ github.run_number }}" \
            --notes "Instalá chanchi.apk en el celular. Si ya tenías Chanchi, se actualiza encima sin perder tus datos." \
            --latest

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chanchi-apk
          path: app/build/outputs/apk/release/app-release.apk

  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chanchi-apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Probar en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app-release.apk
            adb logcat -c
            adb shell pm grant ar.chanchi.app android.permission.POST_NOTIFICATIONS
            adb shell am start -n ar.chanchi.app/.MainActivity
            sleep 12
            adb shell input tap 160 310
            adb shell input text Retiro
            adb shell input keyevent 66
            sleep 8
            adb exec-out screencap -p > shot1.png
            sleep 150
            adb exec-out screencap -p > shot2.png
            adb shell input tap 275 600
            sleep 2
            adb shell input swipe 160 500 160 80 300
            adb shell input swipe 160 500 160 80 300
            adb shell input swipe 160 500 160 80 300
            sleep 2
            adb exec-out screencap -p > shot3.png
            adb shell input tap 125 600
            sleep 8
            adb exec-out screencap -p > shot4.png
            adb logcat -d > logcat.txt
            adb shell dumpsys activity services ar.chanchi.app > services.txt
      - name: Guardar resultados (rama ci-smoke)
        if: always()
        run: |
          D="$RUNNER_TEMP/smoke"
          rm -rf "$D" && mkdir "$D" && cd "$D"
          git init -q && git checkout -q -b ci-smoke
          for f in shot1.png shot2.png shot3.png shot4.png logcat.txt services.txt; do cp "$GITHUB_WORKSPACE/$f" . 2>/dev/null || true; done
          grep -E "ChanchiScan|AndroidRuntime|FATAL|chromium|ar.chanchi" logcat.txt > scan.txt 2>/dev/null || echo "sin log" > scan.txt
          echo "run ${{ github.run_number }}" > STATUS.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "smoke ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-smoke
