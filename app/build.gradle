plugins { id 'com.android.application' }

def vcode = (project.findProperty('versionCode') ?: '1').toInteger()

android {
    namespace 'ar.chanchi.app'
    compileSdk 34
    defaultConfig {
        applicationId 'ar.chanchi.app'
        minSdk 26
        targetSdk 34
        versionCode vcode
        versionName "1.${vcode}"
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        chanchi {
            storeFile file('chanchi.jks')
            storePassword 'chanchi2026'
            keyAlias 'chanchi'
            keyPassword 'chanchi2026'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.chanchi
        }
        debug { signingConfig signingConfigs.chanchi }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
